<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Espace Académique - Faculté Agronomique</title>

    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <link rel="icon" type="image/png" href="icon-96x96.png">

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --primary-blue: #003366; --dark-blue: #002244; --accent-yellow: #ffb347; }
        
        body {
            background: linear-gradient(135deg, var(--primary-blue) 0%, var(--dark-blue) 100%);
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .splash-container {
            text-align: center;
            padding: 20px;
            animation: fadeInUp 0.8s ease-out;
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .logo {
            margin-bottom: 40px;
        }
        
        .logo-icon {
            width: 100px;
            height: 100px;
            background: white;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.3);
        }
        
        .logo-icon i {
            font-size: 60px;
            color: var(--primary-blue);
        }
        
        .logo h1 {
            color: white;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .logo p {
            color: rgba(255,255,255,0.8);
            font-size: 14px;
        }
        
        .loader {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid var(--accent-yellow);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 30px auto;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-text {
            color: rgba(255,255,255,0.7);
            font-size: 14px;
            margin-top: 15px;
        }
        
        .footer {
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 11px;
            color: rgba(255,255,255,0.5);
        }
        
        .footer img {
            width: 30px;
            border-radius: 15px;
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <div class="splash-container">
        <div class="logo">
            <div class="logo-icon">
                <i class="bi bi-book-fill"></i>
            </div>
            <h1>Faculté Agronomique</h1>
            <p>Espace Académique</p>
        </div>
        
        <div class="loader"></div>
        <div class="loading-text">
            <i class="bi bi-arrow-repeat"></i> Chargement de votre espace...
        </div>
        
        <div class="footer">
            <i class="bi bi-shield-check"></i> HYBRILINK-TECH<br>
            <img src="t.png" alt="HYBRILINK" width="25" onerror="this.style.display='none'">
        </div>
    </div>

    <script>
        // Configuration Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBb82N2-5ns7qKjQBAj5UvDW87s2PZ27F0",
            authDomain: "fsa-unilu.firebaseapp.com",
            projectId: "fsa-unilu",
            storageBucket: "fsa-unilu.firebasestorage.app",
            messagingSenderId: "36551990738",
            appId: "1:36551990738:web:e91fdcb53f8aab5d1b7c0b"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        
        async function checkAndRedirect() {
            console.log('🔍 Vérification de la session académique...');
            
            const sessionAcademique = localStorage.getItem('session_academique');
            
            if (sessionAcademique) {
                try {
                    const sessionData = JSON.parse(sessionAcademique);
                    if (Date.now() < sessionData.expires) {
                        console.log('✅ Session académique valide, redirection vers academique.html');
                        window.location.href = 'academique.html';
                        return;
                    } else {
                        console.log('⏰ Session expirée, suppression');
                        localStorage.removeItem('session_academique');
                    }
                } catch(e) {
                    console.error('Erreur de session:', e);
                    localStorage.removeItem('session_academique');
                }
            }
            
            console.log('🔐 Aucune session valide, redirection vers login-academique.html');
            window.location.href = 'login-academique.html';
        }
        
        // Enregistrement du Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('✅ Service Worker enregistré:', reg.scope))
                    .catch(err => console.log('❌ Service Worker erreur:', err));
            });
        }
        
        setTimeout(() => {
            checkAndRedirect();
        }, 1500);
 
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW error:', err));
            });
        }
    </script>
</body>
</html>
